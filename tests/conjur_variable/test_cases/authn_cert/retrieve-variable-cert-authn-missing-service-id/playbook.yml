---
# Integration test: authn-cert authentication should fail gracefully when
# conjur_authn_service_id is not provided.
- name: Retrieve Conjur variable without service_id (expect failure)
  hosts: localhost
  connection: local
  tasks:
    - name: Attempt to retrieve Conjur variable without service_id
      vars:
        super_secret_key: >-
          {{ lookup('conjur_variable', 'ansible/test-secret',
               conjur_authn_type='authn-cert',
               conjur_client_cert_file=lookup('env', 'CONJUR_CLIENT_CERT_FILE'),
               conjur_client_key_file=lookup('env', 'CONJUR_CLIENT_KEY_FILE')) }}
      shell: echo "{{ super_secret_key }}" > /conjur_secrets.txt
      register: result
      ignore_errors: true

    - name: Record that an error was raised
      copy:
        content: "error_raised"
        dest: /conjur_secrets.txt
      when: result is failed
